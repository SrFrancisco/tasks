    <script>
        //document.documentElement.scrollTop = document.body.scrollTop = {{scroll}};
        var myCodeMirror = CodeMirror.fromTextArea(document.getElementById("textbox"), {
            lineNumbers: false,
            spellcheck: true,
            mode:  "todocss",
            size: "30px",
            theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? "material-darker" : "neo" ,
            autoCloseBrackets: true,
            lineWrapping: true,
            extraKeys: {
                "Tab": function(cm){
                  cm.replaceSelection("    " , "end");
                }
            }
        });

        // source: https://codemirror.net/5/demo/indentwrap.html
        var charWidth = myCodeMirror.defaultCharWidth(), basePadding = 4;
        myCodeMirror.on("renderLine", function(cm, line, elt) {
            var off = CodeMirror.countColumn(line.text, null, cm.getOption("tabSize")) * charWidth;
            elt.style.textIndent = "-" + off + "px";
            elt.style.paddingLeft = (basePadding + off) + "px";
          });
        myCodeMirror.refresh();

    </script> 
<script>
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        myCodeMirror.setOption("theme", window.matchMedia('(prefers-color-scheme: dark)').matches ? "material-darker" : "neo")
    });
</script>

<script>
document.getElementById('textbox').addEventListener('keydown', function(e) {
    if (e.key == 'Tab') {
        e.preventDefault();
        var start = this.selectionStart;
        var end = this.selectionEnd;
    
        // set textarea value to: text before caret + tab + text after caret
        this.value = this.value.substring(0, start) +
        "    " + this.value.substring(end);
    
        // put caret at right position again
        this.selectionStart =
        this.selectionEnd = start + 4;
    }
    if(event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.target.form?.dispatchEvent(new Event('submit'));
    }
    });
document.addEventListener('keydown', function(e) {
    if(event.key === "Escape"){
        history.back();
    } else if(event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        //event.target.form?.submit();
        event.target.form?.dispatchEvent(new Event('submit'));
    }
});
</script>
<script>
    function scrollHere(content){
        let headings = [...document.getElementsByClassName('cm-heading'), ...document.getElementsByClassName('cm-heading2')];
        for (const heading of headings) {
            let valToCompare;
            let control;
            console.log(heading.innerText)
            if(heading.innerText.length > 2 && heading.innerText[2]==">"){
                valToCompare = heading.innerText.substring(3).trim();
            } else {
                valToCompare = heading.innerText.substring(2).trim();
            }
            if(content.length > 2 && content[2]==">"){
                control = content.substring(3).trim()
            } else {
                control = content.substring(2).trim()
            }
            if(valToCompare === control){
                heading.scrollIntoView();
                break;
            }
        }
    }
</script>
